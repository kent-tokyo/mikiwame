[package]
name = "mikiwame"
version = "0.3.1"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Explainable materials structure diagnostics: evidence-first anomaly detection for periodic crystal structures."
repository = "https://github.com/kent-tokyo/mikiwame"
authors = ["kent-tokyo <kent-tokyo@users.noreply.github.com>"]
# science::materials is the precise fit (crystallography named explicitly in
# its own description); science::computational-chemistry for cross-discovery
# from the chematic ecosystem's audience; command-line-utilities because the
# `mikiwame` binary is a real, documented feature, not an afterthought.
categories = ["science::materials", "science::computational-chemistry", "command-line-utilities"]
# Chosen to describe what mikiwame *does* (diagnostics on crystal structures),
# not just what data it holds -- structure/lattice representation itself is
# chematic-crystal's keyword territory, not this crate's differentiator.
keywords = ["crystallography", "materials-science", "crystal-structure", "diagnostics", "cheminformatics"]

[dependencies]
chematic-core = "0.16.0"
chematic-crystal = "0.16.0"
chematic-mol = { version = "0.16.0", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }

[dev-dependencies]
serde_json = "1"

[features]
default = ["cli"]
# JSON (de)serialization needed only by the `mikiwame` binary — the library
# itself never requires serde_json (AGENTS.md §19: keep optional-feature
# dependency direction explicit). On by default since most installs of this
# crate want the CLI; `default-features = false` gives a pure-library build.
cli = ["dep:serde_json"]
# CIF input via chematic-mol's occupancy/disorder-preserving adapter. Off by
# default (unlike `cli`) because it pulls in chematic-mol's whole dependency
# tree (chematic-rxn, chematic-perception, chematic-smiles, serde_json) for a
# feature most installs won't need; `--features cif` (or `--all-features`)
# opts in. See tasks/todo.md for the design decision this implements.
cif = ["dep:chematic-mol", "chematic-mol/crystal"]

[[bin]]
name = "mikiwame"
path = "src/bin/mikiwame.rs"
required-features = ["cli"]

[[test]]
name = "cif"
required-features = ["cif"]

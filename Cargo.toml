[package]
name = "mikiwame"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Explainable materials structure diagnostics: evidence-first anomaly detection for periodic crystal structures."
repository = "https://github.com/kent-tokyo/mikiwame"
authors = ["kent-tokyo <kent-tokyo@users.noreply.github.com>"]

[dependencies]
chematic-core = "0.15.0"
chematic-crystal = "0.15.0"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }

[dev-dependencies]
serde_json = "1"

[features]
default = ["cli"]
# JSON (de)serialization needed only by the `mikiwame` binary — the library
# itself never requires serde_json (AGENTS.md §19: keep optional-feature
# dependency direction explicit). On by default since most installs of this
# crate want the CLI; `default-features = false` gives a pure-library build.
cli = ["dep:serde_json"]

[[bin]]
name = "mikiwame"
path = "src/bin/mikiwame.rs"
required-features = ["cli"]
